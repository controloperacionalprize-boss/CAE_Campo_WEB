services:
  - type: web
    name: despacho-campo-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: TRUSTED_HOSTS
        value: "*.onrender.com"
      - key: RATE_LIMIT_PER_MINUTE
        value: "120"
      - key: DATABASE_URL
        sync: false
      - key: API_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
